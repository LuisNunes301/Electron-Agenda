<!-- renderer/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#EEE" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda</title>
  <link href="https://cdn.jsdelivr.net/npm/windows-ui-fabric@4.0.1/dist/config/app-config.css" rel="stylesheet"
    crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/windows-ui-fabric@4.0.1/dist/windows-ui.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/windows-ui-fabric@4.0.1/dist/icons/winui-icons.min.css" rel="stylesheet"
    crossorigin="anonymous">
  <link rel="stylesheet" href="assets/style.css" />

</head>

<body>
  <header class="win-nav-bar">
    <div class="win-nav-bar-left" style="display: flex; align-items: center; gap: 10px;">
      <h1 class="text-xl font-bold">Agenda</h1>
      <button id="btnNovo" class="win-button btn-primary">Novo Contato</button>
      <input list="sugestoesFornecedor" type="search" id="filtroFornecedor" class="win-textbox" placeholder="Buscar por Fornecedor..." />
      <datalist id="sugestoesFornecedor"></datalist>
      <input list="sugestoesTipo1" type="search" id="filtroTipo1" class="win-textbox" placeholder="Buscar por Tipo 1..." />
      <datalist id="sugestoesTipo1"></datalist>
      <input list="sugestoesTipo2" type="search" id="filtroTipo2" class="win-textbox" placeholder="Buscar por Tipo 2..." />
      <datalist id="sugestoesTipo2"></datalist>
      <button id="btnImportarExcel" class="win-button btn-secondary">Importar Excel</button>
      <button id="btnExportarExcel" class="win-button btn-secondary">Exportar Excel</button>
      <button id="btnApagarTodos" class="win-button">Apagar Tudo</button>
    </div>
  </header>



  </header>

  <main>
    <table id="tabelaContatos">
      <thead>
        <tr>
          <th>Nº</th>
          <th>Fornecedor</th>
          <th>DDD</th>
          <th>Telefone Coml</th>
          <th>Celular </th>
          <th>Telefone</th>
          <th>Contato</th>
          <th>Tipo 1</th>
          <th>Tipo 2</th>
          <th>Email</th>
          <th>Observações</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="pagination-container">
        <div style="display: flex; align-items: center; gap: 5px;">
          <label for="selectPageSize">Exibir:</label>
          <select id="selectPageSize" class="win-dropdown" style="padding: 2px 5px; border-radius: 4px;">
            <option value="20">20</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>
        <button id="btnPrev" class="win-button">Anterior</button>
        <span id="pageInfo">Página 1 de 1</span>
        <button id="btnNext" class="win-button">Próxima</button>
    </div>
  </main>

  <aside id="painel">
    <h2 id="painelTitulo">Novo Contato</h2>
    <form id="formulario">
      <input type="hidden" id="id" name="id" />
      <input type="text" id="nome" name="nome" placeholder="Nome" class="win-textbox" required />
      <input type="number" id="ddd" name="ddd" placeholder="DDD" class="win-textbox" />
      <input type="text" id="telefone" name="telefone" placeholder="Telefone" class="win-textbox" />
      <input type="text" id="comercial" name="comercial" placeholder="Telefone Comercial" class="win-textbox" />
      <input type="text" id="celular" name="celular" placeholder="Celular" class="win-textbox" />
      <input type="text" id="contato" name="contato" placeholder="Contato Responsável" class="win-textbox" />
      <input type="text" id="tipo" name="tipo" placeholder="Tipo 1" class="win-textbox" />
      <input type="text" id="tipo2" name="tipo2" placeholder="Tipo 2" class="win-textbox" />
      <input type="email" id="email" name="email" placeholder="Email" class="win-textbox" />
      <textarea id="observacao" name="observacao" placeholder="Observações" class="win-textbox"></textarea>

      <button type="submit" class="win-button btn-success">Salvar</button>
      <button type="button" id="cancelar" class="win-button btn-secondary">Cancelar</button>
    </form>

  </aside>
  <script src="https://cdn.jsdelivr.net/npm/windows-ui-fabric@4.0.1/dist/windows-ui.min.js"
    crossorigin="anonymous"></script>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>

</html>
